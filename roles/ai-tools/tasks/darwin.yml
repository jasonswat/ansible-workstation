---
- name: Tap OpenCode Homebrew tap
  homebrew_tap:
    name: anomalyco/tap
    state: present

- name: Install OpenCode via Homebrew
  homebrew:
    name: anomalyco/tap/opencode
    state: present

- name: Install GitHub Copilot CLI via Homebrew cask
  homebrew_cask: name=copilot-cli state=present

- name: Install Antigravity CLI via Homebrew cask
  homebrew_cask: name=antigravity-cli state=present

- name: Install Cursor IDE via Homebrew cask
  homebrew_cask: name=cursor state=present
