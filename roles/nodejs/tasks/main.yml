---
- name: install nvm
  shell: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ version }}/install.sh | /bin/bash
  args:
    creates: "{{ local_home }}/.nvm"

- name: Install latest nodejs using nvm
  ansible.builtin.shell: |
    . {{ local_home }}/.nvm/nvm.sh
    nvm install node
    nvm alias default node
  args:
    executable: /bin/bash
  register: node_install
  changed_when: "'is already installed' not in node_install.stdout"
