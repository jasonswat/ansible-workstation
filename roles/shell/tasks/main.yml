---
- name: Sync bash-it repo
  git:
    repo: 'https://github.com/Bash-it/bash-it.git'
    dest: "{{ local_home }}/.bash_it"
    depth: 1
    version: '{{ version }}'
  become_user: '{{ user }}'

- name: Install GNU bash since MacOs uses old version
  homebrew: name=bash state=present
  when: ansible_os_family == "Darwin"

- name: Check whether Bash-It is already configured in shell rc files
  ansible.builtin.command: |
    grep -E "bash_it|bash-it" "{{ local_home }}/.bashrc" "{{ local_home }}/.bash_profile" 2>/dev/null || true
  register: bash_it_config_check
  changed_when: false
  failed_when: false
  become_user: '{{ user }}'

- name: Install Bash-It via its installer if not configured
  ansible.builtin.shell: ./install.sh --silent
  args:
    executable: /bin/bash
    chdir: "{{ local_home }}/.bash_it"
  become_user: '{{ user }}'
  when: "bash_it_config_check.stdout == ''"
  environment:
    HOME: "{{ local_home }}"

- name: Create shell directories
  file:
    path: '{{ item }}'
    state: directory
    mode: 0700
    owner: '{{ user }}'
  with_items:
    - "{{ local_home }}/.shell"
    - "{{ local_home }}/.ssh"
    - "{{ local_home }}/.ssh/config.d"
    - "{{ local_home }}/bin"