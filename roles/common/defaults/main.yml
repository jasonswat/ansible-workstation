---
homebrew_path:
  x86_64: "/usr/local/bin/brew"
  arm64: "/opt/homebrew/bin/brew"

# packages that can be installed with apt/ubuntu or brew/darwin
common_packages:
- bzip2
- curl
- elixir
- git
- gcc
- gzip
- htop
- jq
- nmap
- ngrep
- openssl
- pssh
- shellcheck
- tree
- tcpdump
- watch
- wget
- yamllint
- yq

# packages only installed on ubuntu
install_ubuntu_packages:
- alsa-base
- alsa-utils
- apt-transport-https
- aptitude
- ca-certificates
- chrony
- clamav
- bash-completion
- bluez
- build-essential
- dkms
- gimp
- git-core
- git-flow
- git-extras
- gstreamer1.0-alsa
- gstreamer1.0-plugins-base-apps
- linux-headers-generic
- mtr
- mc
- netcat-openbsd
- nnn
- openssh-server
- pwgen
- pydf
- software-properties-common
- silversearcher-ag
- smbclient
- tmux
- tar
- unzip
- vlc
- xorg

# packages only installed on ubuntu < 26.04 (removed from 26.04 repos)
install_ubuntu_packages_legacy:
- clamav-daemon
- gnupg-agent
- gstreamer1.0-pulseaudio
- pulseaudio
- ubuntu-restricted-extras
- wireless-tools

# packages only installed on ubuntu >= 26.04 (replacements for removed packages)
install_ubuntu_packages_26_04:
- iw

# packages only installed on macos with brew 
brew_packages:
- autoconf
- automake
- awscli
- elixir
- fzf
- kcat
- kubernetes-cli
- macvim
- mas
- node
- packer
- the_silver_searcher

# packages removed from ubuntu (mostly games that get installed on desktop editions)
remove_ubuntu_packages:
- aisleriot
- ack
- five-or-more
- four-in-a-row
- gbrainy
- gnome-chess
- gnome-mines
- gnome-sudoku
- gnome-mahjongg
- gnome-games-common
- gnome-taquin
- gnome-tetravex
- hitori
- iagno
- lightsoff
- libgnome-games-support-common
- quadrapassel
- swell-foop
- tali
- unity-webapps-common
