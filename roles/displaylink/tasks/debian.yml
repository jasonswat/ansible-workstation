---
- name: Install dkms (required for DisplayLink)
  apt:
    name: dkms
    state: present
  become: yes

- name: Create Downloads directory
  file:
    path: "{{ local_home }}/Downloads"
    state: directory

- name: Download DisplayLink standalone installer
  get_url:
    url: "https://www.synaptics.com/products/displaylink-usb-graphics-software-ubuntu-{{ version | replace('.', '') }}?filetype=exe"
    dest: "{{ local_home }}/Downloads/displaylink-driver.run"
    mode: '0755'

- name: Install DisplayLink driver via standalone installer
  command: "{{ local_home }}/Downloads/displaylink-driver.run"
  become: yes
  args:
    creates: /opt/displaylink/DisplayLinkManager

- name: Remove DisplayLink installer
  file:
    path: "{{ local_home }}/Downloads/displaylink-driver.run"
    state: absent
